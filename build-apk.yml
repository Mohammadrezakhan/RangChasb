XML

          cat > app/src/main/java/com/rangchasb/app/MainActivity.java <<'JAVA'
package com.rangchasb.app;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {
    private LinearLayout list;

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        buildUi();
    }

    private TextView text(String value, float size, boolean bold) {
        TextView t = new TextView(this);
        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(Color.rgb(30,30,30));
        t.setGravity(Gravity.RIGHT | Gravity.CENTER_VERTICAL);
        if (bold) t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        t.setPadding(24, 18, 24, 18);
        return t;
    }

    private void buildUi() {
        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(20, 20, 20, 20);
        root.setBackgroundColor(Color.rgb(248,249,250));

        TextView title = text("فروشگاه رنگ و چسب", 26, true);
        title.setGravity(Gravity.CENTER);
        root.addView(title, new LinearLayout.LayoutParams(-1, -2));

        TextView subtitle = text("مدیریت کالا، قیمت و فروش", 16, false);
        subtitle.setGravity(Gravity.CENTER);
        root.addView(subtitle);

        LinearLayout buttons = new LinearLayout(this);
        buttons.setOrientation(LinearLayout.VERTICAL);
        addButton(buttons, "➕ ثبت کالای جدید", v -> addProduct());
        addButton(buttons, "📦 کالاها و قیمت‌ها", v -> Toast.makeText(this, "بخش کالاها در نسخه بعدی تکمیل می‌شود", Toast.LENGTH_SHORT).show());
        addButton(buttons, "🧾 ثبت فروش", v -> Toast.makeText(this, "بخش فروش آماده توسعه است", Toast.LENGTH_SHORT).show());
        addButton(buttons, "👥 مشتریان", v -> Toast.makeText(this, "بخش مشتریان آماده توسعه است", Toast.LENGTH_SHORT).show());
        root.addView(buttons);

        TextView h = text("کالاهای ثبت‌شده", 20, true);
        root.addView(h);
        list = new LinearLayout(this);
        list.setOrientation(LinearLayout.VERTICAL);
        root.addView(list, new LinearLayout.LayoutParams(-1, 0, 1));

        setContentView(root);
    }

    private void addButton(LinearLayout parent, String label, View.OnClickListener listener) {
        Button b = new Button(this);
        b.setText(label);
        b.setTextSize(16);
        b.setOnClickListener(listener);
        parent.addView(b, new LinearLayout.LayoutParams(-1, -2));
    }

    private void addProduct() {
        LinearLayout box = new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(20, 10, 20, 10);

        EditText name = new EditText(this);
        name.setHint("نام کالا");
        box.addView(name);

        EditText price = new EditText(this);
        price.setHint("قیمت (تومان)");
        price.setInputType(2);
        box.addView(price);

        Button save = new Button(this);
        save.setText("ذخیره کالا");
        box.addView(save);
        list.addView(box);

        save.setOnClickListener(v -> {
            String n = name.getText().toString().trim();
            String p = price.getText().toString().trim();
            if (n.isEmpty() || p.isEmpty()) {
                Toast.makeText(this, "نام و قیمت را وارد کن", Toast.LENGTH_SHORT).show();
                return;
            }
            TextView item = text(n + "   |   " + p + " تومان", 17, true);
            list.addView(item, 0);
            box.setVisibility(View.GONE);
            Toast.makeText(this, "کالا ثبت شد", Toast.LENGTH_SHORT).show();
        });
    }
}
JAVA

          # Install a local Gradle distribution and build.
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RangChasb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
