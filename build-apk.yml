name: Build RangChasb APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project files
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/rangchasb/app

          cat > settings.gradle <<'GRADLE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'RangChasb'
include ':app'
GRADLE

          cat > build.gradle <<'GRADLE'
plugins {
    id 'com.android.application' version '8.6.1' apply false
}
GRADLE

          cat > gradle.properties <<'PROPS'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
PROPS

          cat > app/build.gradle <<'GRADLE'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rangchasb.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rangchasb.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:theme="@style/AppTheme"
        android:label="رنگ و چسب"
